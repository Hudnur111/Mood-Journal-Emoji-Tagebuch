<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Mood-Journal / Emoji-Tagebuch mit Uhrzeit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
    rel="stylesheet"
  />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    main {
      background: white;
      border-radius: 1rem 1rem 0 0;
      box-shadow: 0 -8px 24px rgba(0,0,0,0.15);
      margin-top: auto;
      padding-bottom: 3rem;
    }
    #calendar {
      scrollbar-width: thin;
      scrollbar-color: #a78bfa #f3f4f6;
    }
    #calendar::-webkit-scrollbar {
      height: 6px;
    }
    #calendar::-webkit-scrollbar-track {
      background: #f3f4f6;
      border-radius: 3px;
    }
    #calendar::-webkit-scrollbar-thumb {
      background-color: #a78bfa;
      border-radius: 3px;
    }
    @media (max-width: 400px) {
      .emoji-btn {
        font-size: 3.5rem !important;
      }
      #selected-emoji-text {
        font-size: 1.125rem !important;
      }
      #save-emoji-btn {
        font-size: 1.125rem !important;
        padding-top: 0.75rem !important;
        padding-bottom: 0.75rem !important;
      }
      #calendar > div {
        min-height: 56px !important;
      }
    }
    #entries-list {
      max-height: 180px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #a78bfa #f3f4f6;
    }
    #entries-list::-webkit-scrollbar {
      width: 6px;
    }
    #entries-list::-webkit-scrollbar-track {
      background: #f3f4f6;
      border-radius: 3px;
    }
    #entries-list::-webkit-scrollbar-thumb {
      background-color: #a78bfa;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <header class="bg-white bg-opacity-20 backdrop-blur-md text-white p-5 shadow-md sticky top-0 z-30 flex justify-center items-center">
    <h1 class="text-2xl font-extrabold tracking-tight drop-shadow-md">Mood-Journal / Emoji-Tagebuch mit Uhrzeit</h1>
  </header>

  <main class="max-w-md mx-auto p-6 space-y-8">
    <section class="rounded-xl shadow-lg p-6 bg-gradient-to-br from-indigo-100 to-purple-200">
      <h2 class="text-xl font-semibold mb-6 text-center text-indigo-900 drop-shadow-sm">Wie fühlst du dich jetzt?</h2>
      <div class="grid grid-cols-5 gap-6 justify-items-center">
        <button aria-label="Sehr glücklich" data-emoji="😄" class="emoji-btn text-6xl hover:scale-110 transition-transform focus:outline-none focus:ring-4 focus:ring-indigo-500 rounded-full bg-white shadow-md active:scale-95">
          😄
        </button>
        <button aria-label="Glücklich" data-emoji="🙂" class="emoji-btn text-6xl hover:scale-110 transition-transform focus:outline-none focus:ring-4 focus:ring-indigo-500 rounded-full bg-white shadow-md active:scale-95">
          🙂
        </button>
        <button aria-label="Neutral" data-emoji="😐" class="emoji-btn text-6xl hover:scale-110 transition-transform focus:outline-none focus:ring-4 focus:ring-indigo-500 rounded-full bg-white shadow-md active:scale-95">
          😐
        </button>
        <button aria-label="Traurig" data-emoji="😔" class="emoji-btn text-6xl hover:scale-110 transition-transform focus:outline-none focus:ring-4 focus:ring-indigo-500 rounded-full bg-white shadow-md active:scale-95">
          😔
        </button>
        <button aria-label="Sehr traurig" data-emoji="😢" class="emoji-btn text-6xl hover:scale-110 transition-transform focus:outline-none focus:ring-4 focus:ring-indigo-500 rounded-full bg-white shadow-md active:scale-95">
          😢
        </button>
      </div>
      <p id="selected-emoji-text" class="mt-5 text-center text-lg font-semibold text-indigo-900 min-h-[1.75rem] select-none"></p>
      <button id="save-emoji-btn" disabled class="mt-6 w-full bg-indigo-700 text-white py-3 rounded-xl font-semibold shadow-lg hover:bg-indigo-800 transition disabled:opacity-50 disabled:cursor-not-allowed active:scale-95">
        Stimmung speichern
      </button>
    </section>

    <section class="rounded-xl shadow-lg p-6 bg-gradient-to-br from-purple-100 to-indigo-200">
      <h2 class="text-xl font-semibold mb-5 text-center text-indigo-900 drop-shadow-sm">Letzte Einträge</h2>
      <div id="entries-list" class="space-y-3 text-indigo-900 font-medium text-sm max-w-md mx-auto select-text">
      </div>
    </section>

    <section class="rounded-xl shadow-lg p-6 bg-gradient-to-br from-indigo-100 to-purple-200">
      <h2 class="text-xl font-semibold mb-5 text-center text-indigo-900 drop-shadow-sm">Monatsübersicht</h2>
      <div id="calendar" class="grid grid-cols-7 gap-2 text-center text-sm select-none">
        <div class="font-semibold text-indigo-700">Mo</div>
        <div class="font-semibold text-indigo-700">Di</div>
        <div class="font-semibold text-indigo-700">Mi</div>
        <div class="font-semibold text-indigo-700">Do</div>
        <div class="font-semibold text-indigo-700">Fr</div>
        <div class="font-semibold text-indigo-700">Sa</div>
        <div class="font-semibold text-indigo-700">So</div>
      </div>
    </section>

    <section class="rounded-xl shadow-lg p-6 bg-gradient-to-br from-purple-100 to-indigo-200">
      <h2 class="text-xl font-semibold mb-5 text-center text-indigo-900 drop-shadow-sm">Statistik</h2>
      <div id="stats" class="space-y-5 max-w-md mx-auto select-none">
      </div>
    </section>
  </main>

  <footer class="bg-white bg-opacity-20 backdrop-blur-md text-indigo-100 p-5 text-center text-sm font-light tracking-wide select-none">
    &copy; 2024 Mood-Journal / Emoji-Tagebuch mit Uhrzeit
  </footer>

  <script>
    // Alle Emoji-Buttons auswählen
    const emojiButtons = document.querySelectorAll('.emoji-btn');
    // Textfeld für ausgewähltes Emoji
    const selectedEmojiText = document.getElementById('selected-emoji-text');
    // Speichern-Button
    const saveBtn = document.getElementById('save-emoji-btn');
    // Kalender-Container
    const calendarEl = document.getElementById('calendar');
    // Statistik-Container
    const statsEl = document.getElementById('stats');
    // Liste der letzten Einträge
    const entriesList = document.getElementById('entries-list');

    // Daten zu Emojis: Label und Farbe für Statistik
    const emojiData = {
      '😄': { label: 'Sehr glücklich', color: 'bg-green-500' },
      '🙂': { label: 'Glücklich', color: 'bg-green-400' },
      '😐': { label: 'Neutral', color: 'bg-yellow-400' },
      '😔': { label: 'Traurig', color: 'bg-orange-500' },
      '😢': { label: 'Sehr traurig', color: 'bg-red-500' },
    };

    let selectedEmoji = null;

    // Wenn ein Emoji-Button geklickt wird
    emojiButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        selectedEmoji = btn.getAttribute('data-emoji');
        selectedEmojiText.textContent = `Ausgewählt: ${emojiData[selectedEmoji].label} ${selectedEmoji}`;
        saveBtn.disabled = false;

        // Ring um das ausgewählte Emoji setzen
        emojiButtons.forEach(b => b.classList.remove('ring-4', 'ring-indigo-600'));
        btn.classList.add('ring-4', 'ring-indigo-600');
      });
    });

    // Wenn speichern-Button geklickt wird
    saveBtn.addEventListener('click', () => {
      if (!selectedEmoji) return;
      const now = new Date();
      const entry = {
        emoji: selectedEmoji,
        label: emojiData[selectedEmoji].label,
        timestamp: now.toISOString()
      };
      try {
        saveEntry(entry); // Eintrag speichern
        selectedEmojiText.textContent = `Stimmung gespeichert: ${entry.label} ${entry.emoji} um ${formatTime(now)}`;
        saveBtn.disabled = true;
        emojiButtons.forEach(b => b.classList.remove('ring-4', 'ring-indigo-600'));
        selectedEmoji = null;
        renderEntries();  // Liste aktualisieren
        renderCalendar(); // Kalender aktualisieren
        renderStats();    // Statistik aktualisieren
      } catch (e) {
        alert('Fehler beim Speichern der Stimmung. Bitte versuche es erneut.');
        console.error('Speicherfehler:', e);
      }
    });

    // Eintrag in localStorage speichern
    function saveEntry(entry) {
      let entries = [];
      try {
        const raw = localStorage.getItem('moodEntries');
        if (raw) {
          entries = JSON.parse(raw);
          if (!Array.isArray(entries)) {
            entries = [];
          }
        }
      } catch {
        entries = [];
      }
      entries.push(entry);
      // Nur Einträge der letzten 60 Tage behalten
      const cutoff = new Date();
      cutoff.setDate(cutoff.getDate() - 60);
      entries = entries.filter(e => {
        const d = new Date(e.timestamp);
        return d >= cutoff;
      });
      localStorage.setItem('moodEntries', JSON.stringify(entries));
    }

    // Alle Einträge aus localStorage holen
    function getEntries() {
      try {
        const raw = localStorage.getItem('moodEntries');
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return [];
        return parsed;
      } catch {
        return [];
      }
    }

    // Datum als Schlüssel (YYYY-MM-DD) formatieren
    function formatDateKey(date) {
      return date.toISOString().slice(0, 10);
    }

    // Zeit als HH:mm formatieren
    function formatTime(date) {
      return date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    }

    // Für Kalender: Neueste Stimmung pro Tag im Monat holen
    function getMonthData(year, month) {
      const entries = getEntries();
      const moods = {};
      // Nur Einträge vom aktuellen Monat filtern
      const filtered = entries.filter(e => {
        const d = new Date(e.timestamp);
        return d.getFullYear() === year && d.getMonth() === month;
      });
      // Für jeden Tag den neuesten Eintrag speichern
      filtered.forEach(e => {
        const d = new Date(e.timestamp);
        const day = d.getDate();
        if (!moods[day] || new Date(moods[day].timestamp) < d) {
          moods[day] = e;
        }
      });
      return moods;
    }

    // Kalender anzeigen
    function renderCalendar() {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();

      // Alte Tage entfernen (außer Wochentage-Header)
      while (calendarEl.children.length > 7) {
        calendarEl.removeChild(calendarEl.lastChild);
      }

      const moods = getMonthData(year, month);

      // Erster Wochentag des Monats (Sonntag=0, Montag=1,...)
      const firstDay = new Date(year, month, 1).getDay();
      // Umrechnen, damit Montag=0 ist
      const startIndex = (firstDay + 6) % 7;

      const daysInMonth = new Date(year, month + 1, 0).getDate();

      // Leere Felder vor dem ersten Tag einfügen
      for (let i = 0; i < startIndex; i++) {
        const emptyDiv = document.createElement('div');
        calendarEl.appendChild(emptyDiv);
      }

      // Tage mit Emoji anzeigen
      for (let day = 1; day <= daysInMonth; day++) {
        const dayDiv = document.createElement('div');
        dayDiv.className = 'p-2 rounded-lg cursor-default select-none flex flex-col items-center justify-center min-h-[64px] transition-colors duration-300';

        const moodEntry = moods[day];
        if (moodEntry) {
          dayDiv.classList.add('bg-indigo-100', 'shadow-inner');
        } else {
          dayDiv.classList.add('hover:bg-indigo-50');
        }

        const dayNum = document.createElement('div');
        dayNum.textContent = day;
        dayNum.className = 'font-semibold mb-1 text-indigo-900';

        const emojiSpan = document.createElement('span');
        emojiSpan.className = 'text-3xl';
        emojiSpan.textContent = moodEntry ? moodEntry.emoji : '';

        dayDiv.appendChild(dayNum);
        dayDiv.appendChild(emojiSpan);

        calendarEl.appendChild(dayDiv);
      }
    }

    // Letzte 10 Einträge anzeigen
    function renderEntries() {
      const entries = getEntries();
      // Neueste zuerst sortieren
      entries.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
      const last10 = entries.slice(0, 10);

      entriesList.innerHTML = '';
      if (last10.length === 0) {
        const p = document.createElement('p');
        p.textContent = 'Keine Einträge vorhanden.';
        p.className = 'text-center text-indigo-700 font-medium';
        entriesList.appendChild(p);
        return;
      }

      last10.forEach(e => {
        const d = new Date(e.timestamp);
        const entryDiv = document.createElement('div');
        entryDiv.className = 'flex items-center space-x-3 bg-white rounded-lg shadow px-4 py-2';

        const emojiSpan = document.createElement('span');
        emojiSpan.textContent = e.emoji;
        emojiSpan.className = 'text-3xl select-none';

        const textDiv = document.createElement('div');
        textDiv.className = 'flex flex-col text-indigo-900';

        const labelSpan = document.createElement('span');
        labelSpan.textContent = e.label;
        labelSpan.className = 'font-semibold';

        const dateSpan = document.createElement('span');
        dateSpan.textContent = `${d.toLocaleDateString('de-DE')} - ${formatTime(d)}`;
        dateSpan.className = 'text-xs text-indigo-700';

        textDiv.appendChild(labelSpan);
        textDiv.appendChild(dateSpan);

        entryDiv.appendChild(emojiSpan);
        entryDiv.appendChild(textDiv);

        entriesList.appendChild(entryDiv);
      });
    }

    // Statistik anzeigen
    function renderStats() {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();

      const entries = getEntries();
      // Nur Einträge vom aktuellen Monat filtern
      const filtered = entries.filter(e => {
        const d = new Date(e.timestamp);
        return d.getFullYear() === year && d.getMonth() === month;
      });

      // Anzahl pro Emoji zählen
      const counts = {};
      Object.keys(emojiData).forEach(e => (counts[e] = 0));
      filtered.forEach(e => {
        if (counts[e.emoji] !== undefined) counts[e.emoji]++;
      });

      const total = Object.values(counts).reduce((a, b) => a + b, 0);

      statsEl.innerHTML = '';

      if (total === 0) {
        const noData = document.createElement('p');
        noData.textContent = 'Keine Stimmungsdaten für diesen Monat.';
        noData.className = 'text-center text-indigo-700 font-medium';
        statsEl.appendChild(noData);
        return;
      }

      Object.entries(emojiData).forEach(([emoji, { label, color }]) => {
        const count = counts[emoji];
        if (count === 0) return;

        const percent = ((count / total) * 100).toFixed(1);

        const statRow = document.createElement('div');
        statRow.className = 'flex items-center space-x-4';

        const labelDiv = document.createElement('div');
        labelDiv.className = 'w-32 text-indigo-900 font-semibold flex items-center space-x-2 select-text';
        const emojiSpan = document.createElement('span');
        emojiSpan.textContent = emoji;
        emojiSpan.className = 'text-3xl';
        const textSpan = document.createElement('span');
        textSpan.textContent = label;
        labelDiv.appendChild(emojiSpan);
        labelDiv.appendChild(textSpan);

        const barContainer = document.createElement('div');
        barContainer.className = 'flex-1 bg-indigo-200 rounded-full h-7 overflow-hidden shadow-inner';

        const bar = document.createElement('div');
        bar.className = `${color} h-7 rounded-full flex items-center justify-end pr-3 text-white font-semibold text-sm select-none`;
        bar.style.width = `${percent}%`;
        bar.textContent = `${count} (${percent}%)`;

        barContainer.appendChild(bar);

        statRow.appendChild(labelDiv);
        statRow.appendChild(barContainer);

        statsEl.appendChild(statRow);
      });
    }

    // Seite laden: alles anzeigen
    renderEntries();
    renderCalendar();
    renderStats();
  </script>
</body>
</html>
